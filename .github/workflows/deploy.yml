# Deploy marketing site to endedge.co on 161.97.146.222 (port 5533).
# Requires self-hosted runner on the Contabo server (label: Linux).

name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: endedge-website-production
  cancel-in-progress: true

env:
  DEPLOY_PATH: ${{ vars.WEBSITE_DEPLOY_PATH || '/home/endedge/htdocs/endedge.co/app' }}
  SITE_USER: ${{ vars.WEBSITE_SITE_USER || 'endedge' }}
  APP_PORT: ${{ vars.WEBSITE_APP_PORT || '5533' }}

jobs:
  deploy:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect target paths
        run: |
          set -euxo pipefail
          sudo ls -la "/home/${{ env.SITE_USER }}/" || true
          sudo ls -la "/home/${{ env.SITE_USER }}/htdocs/" || true
          sudo ls -la "$(dirname "${{ env.DEPLOY_PATH }}")" || true
          curl -sI "http://127.0.0.1:${{ env.APP_PORT }}/" | head -5 || true

      - name: Bootstrap Node (first run)
        run: |
          set -euo pipefail
          SITE_USER="${{ env.SITE_USER }}"
          if ! sudo -u "$SITE_USER" bash -lc 'command -v node >/dev/null && node -v | grep -q "^v22"'; then
            sudo -u "$SITE_USER" bash scripts/bootstrap-server.sh
          fi

      - name: Sync to production directory
        run: |
          set -euo pipefail
          APP_DIR="${{ env.DEPLOY_PATH }}"
          SITE_USER="${{ env.SITE_USER }}"
          sudo mkdir -p "$APP_DIR"
          sudo rsync -a --delete \
            --exclude node_modules \
            --exclude .next \
            --exclude .git \
            --exclude .env.local \
            --exclude ssh \
            ./ "$APP_DIR/"
          sudo chown -R "${SITE_USER}:${SITE_USER}" "$(dirname "$APP_DIR")"

      - name: Write production environment
        run: |
          set -euo pipefail
          APP_DIR="${{ env.DEPLOY_PATH }}"
          SITE_USER="${{ env.SITE_USER }}"
          sudo -u "$SITE_USER" tee "$APP_DIR/.env.local" >/dev/null <<EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL=${{ secrets.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514' }}
          EOF
          sudo chown "${SITE_USER}:${SITE_USER}" "$APP_DIR/.env.local"
          sudo chmod 600 "$APP_DIR/.env.local"

      - name: Build and restart
        run: |
          set -euo pipefail
          APP_DIR="${{ env.DEPLOY_PATH }}"
          SITE_USER="${{ env.SITE_USER }}"
          sudo -u "$SITE_USER" env HOME="/home/${SITE_USER}" \
            bash -c "cd '$APP_DIR' && SKIP_GIT_PULL=1 bash scripts/deploy-remote.sh"

      - name: Verify app responds
        run: |
          sleep 5
          curl -fsS -o /dev/null "http://127.0.0.1:${{ env.APP_PORT }}/" || {
            echo "App not responding on port ${{ env.APP_PORT }}"
            sudo -u "${{ env.SITE_USER }}" pm2 logs endedge-website --lines 30 --nostream || true
            exit 1
          }
